name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    env:
      EDDIE_REQUIRE_BROWSER: ${{ matrix.node == 22 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Browser tests use the runner's preinstalled Chrome (and skip below Node 22).
      - name: Point tests at Chrome (Linux)
        if: runner.os == 'Linux'
        run: echo "EDDIE_TEST_CHROME=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - run: npm test
